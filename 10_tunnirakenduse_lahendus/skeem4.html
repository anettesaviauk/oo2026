<!doctype html>
<html>

<head>
    <title>Takisti</title>
    <script src="skeem4.js"></script>
    <script>
        let r1, r2, sc1;
        function startPage() {
            r1 = new Resistor("R1", 110);
            r2 = new Resistor("R2", 220);
            r3 = new Resistor("R3", 500);
            r4 = new Resistor("R4", 220);
            sc1 = new SeriesConnection("SC1");
            sc1.addResistor(r1);
            sc1.addResistor(r2);
            sc2 = new SeriesConnection("SC2");
            sc2.addResistor(sc1);
            sc2.addResistor(r3);
            sc2.addResistor(r4);
            sc2.draw(canvas1.getContext("2d"), 10, 50);
        }
    </script>
    <meta charset="utf-8">
</head>

<body onload="startPage()">
    <canvas id="canvas1" width="600" height="100"></canvas><br />
    <label>R1:</label>
    <input type="range" id="slaider1" min="1" max="500"
        onchange="r1.setR(slaider1.valueAsNumber); sc2.draw(canvas1.getContext('2d'), 10, 50);" />
    <br>
    <label>R2:</label>
    <input type="range" id="slaider2" min="1" max="500"
        onchange="r2.setR(slaider2.valueAsNumber); sc2.draw(canvas1.getContext('2d'), 10, 50);" />
    <br>
    <label>R3:</label>
    <input type="range" id="slaider3" min="1" max="500"
        onchange="r3.setR(slaider3.valueAsNumber); sc2.draw(canvas1.getContext('2d'), 10, 50);" />
    <br>
    <label>R4:</label>
    <input type="range" id="slaider4" min="1" max="500"
        onchange="r4.setR(slaider4.valueAsNumber); sc2.draw(canvas1.getContext('2d'), 10, 50);" />

</html>
