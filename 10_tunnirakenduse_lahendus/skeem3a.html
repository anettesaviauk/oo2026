<!doctype html>
<html>

<head>
    <title>Takisti</title>
    <script src="skeem2.js"></script>
    <script>
        let r1, r2, sc1;
        function startPage() {
            r1 = new Resistor("R1");
            r2 = new Resistor("R2");
            r3 = new Resistor("R3");

            sc1 = new SeriesConnection("SC1");

            sc1.addResistor(r1);
            sc1.addResistor(r2);
            sc1.addResistor(r3);

            sc1.draw(canvas1.getContext("2d"), 10, 50);

        }

        function lisaTakisti() {
            let takisti = document.getElementById("takisti").value;
            let takisti1 = new Resistor(takisti);
            canvas1.getContext("2d").clearRect(0, 0, 400, 400);
            sc1.addResistor(takisti1);
            sc1.draw(canvas1.getContext("2d"), 10, 50);
        }
    </script>
    <meta charset="utf-8">
</head>

<body onload="startPage()">
    <canvas id="canvas1" width="400" height="400"></canvas><br />
    <br>
    <form>
        <label for="takisti">Takisti nimetus:</label>
        <input type="text" id="takisti" name="takisti"><br><br>
        <input type="button" value="Lisa" onclick="lisaTakisti()">
    </form>
</body>

</html>
