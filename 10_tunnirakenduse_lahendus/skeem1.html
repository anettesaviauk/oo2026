<!doctype html>
<html>

<head>
    <title>Takisti</title>
    <script src="skeem1.js"></script>
    <script>
        let r1;
        function startPage() {
            r1 = new Resistor("r1");
            r2 = new Resistor("r2");
            r1.draw(canvas1.getContext("2d"), 10, 50);
            r2.draw(canvas1.getContext("2d"), 60, 50);

        }
    </script>
    <meta charset="utf-8">
</head>

<body onload="startPage()">
    <canvas id="canvas1" width="800" height="400"></canvas><br />
</body>

</html>
